name: Upstream Sync

on:
  schedule:
    - cron: "0 1 * * *" # Daily at 01:00 UTC
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.fork }}
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/dreamhunter2333/cloudflare_temp_email.git 2>/dev/null || true
          git fetch upstream main
          if git merge -X ours upstream/main -m "chore: sync upstream changes" --no-edit; then
            echo "Merged upstream changes successfully"
          else
            echo "Conflicts detected, resolving with ours..."
            git checkout --ours .
            git add -A
            git commit -m "chore: sync upstream changes"
          fi
          git push origin main
